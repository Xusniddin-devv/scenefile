name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @scenefile/render exec playwright-core install --with-deps chromium --only-shell
      - run: pnpm typecheck
      - run: pnpm test
      - name: The generated skill file is up to date
        run: pnpm generate && git diff --exit-code skills
      - name: The packages install and render from their published form
        run: node scripts/pack-test.mjs
