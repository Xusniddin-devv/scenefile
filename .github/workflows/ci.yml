name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @scenefile/render exec playwright-core install --with-deps chromium --only-shell
      - run: pnpm typecheck
      - name: Keep the default voice and the listening model between runs
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/scenefile/voices
            ~/.cache/scenefile/hearing
          key: models-kokoro-en-v0_19-whisper-base
      - name: Install the default voice and the listening model, so both are tested for real
        run: |
          node packages/cli/dist/main.js voices install en-emma
          node packages/cli/dist/main.js transcribe --install
      - run: pnpm test
      - name: The generated skill file is up to date
        run: pnpm generate && git diff --exit-code skills
      - name: The packages install and render from their published form
        run: node scripts/pack-test.mjs
